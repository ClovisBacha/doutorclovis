name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  # Os testes são o portão de LÓGICA. `tsc` vê tipo, `eslint` vê estilo, o build
  # vê compilação — e todo defeito que as revisões deste projeto encontraram foi
  # de lógica. O hook de pre-commit pode ser pulado com `--no-verify`; este não.
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test src/
      # A auditoria de conteúdo existia, era boa (cobertura de dias, gabarito
      # fora de faixa, "marque todos" degenerado, enunciado repetido em 14
      # dias) — e não estava em portão nenhum. Um verificador só a encontrou
      # lendo o package.json. Script que ninguém roda é documentação.
      - run: bun run audit:conteudo

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
