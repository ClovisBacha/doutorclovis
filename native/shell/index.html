<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Obstétrica</title>
    <!--
      A tela que aparece quando não há rede.

      Enquanto a casca carrega o site publicado (ver `capacitor.config.ts`), esta
      é a única coisa que existe dentro do aparelho. Ela precisa dar conta de um
      caso concreto: a paciente abre o app no elevador do hospital, sem sinal.

      Por isso ela NÃO é uma tela de erro. Ela dá o telefone do consultório e o
      do SAMU em texto puro, que funciona sem rede nenhuma — e é a única coisa
      útil que um app sem conexão pode oferecer a uma gestante de alto risco.

      Quando a migração para bundle local acontecer, este arquivo some e o app
      inteiro passa a viver aqui.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        padding: calc(env(safe-area-inset-top, 0px) + 2rem) 1.75rem
          calc(env(safe-area-inset-bottom, 0px) + 2rem);
        background: linear-gradient(180deg, #0b0b17 0%, #241a33 55%, #3d2a52 100%);
        color: #f4f0f8;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        max-width: 22rem;
        font-size: 0.9rem;
        line-height: 1.6;
        color: rgba(244, 240, 248, 0.72);
      }
      .telefones {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
        max-width: 20rem;
      }
      a {
        display: block;
        padding: 0.9rem 1rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .samu {
        background: #e0384a;
        color: #fff;
      }
      .consultorio {
        background: rgba(255, 255, 255, 0.12);
        color: #f4f0f8;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .nota {
        font-size: 0.75rem;
        color: rgba(244, 240, 248, 0.45);
      }
    </style>
  </head>
  <body>
    <h1>Sem conexão</h1>
    <p>
      O app precisa de internet para carregar a sua gestação. Se for urgente, os telefones abaixo
      funcionam sem rede.
    </p>

    <!--
      ⚠️ ESTA TELA NÃO SABE DE QUEM É A PACIENTE — e por isso ela não pode
      oferecer um consultório como se fosse o dela.

      O app é multi-tenant (`patient_profiles.doctor_id`), e a casca do
      Capacitor não tem acesso a nada da conta: ela é um arquivo estático
      dentro do aparelho, sem sessão e sem banco. Aqui havia
      `tel:+5531986342903` rotulado só "Consultório" — o número do consultório
      FUNDADOR (`src/lib/doctor.config.ts`), oferecido a paciente de qualquer
      médico da plataforma.

      É exatamente o que `emergency-sheet.tsx` gastou uma decisão inteira para
      não fazer, com a razão escrita lá: "um SOS que liga para o médico errado
      é pior que um SOS que não liga para ninguém, porque ela vai esperar do
      outro lado uma resposta que não vem".

      O 192 fica, e é a melhor coisa desta tela: ele é certo para todo mundo,
      em qualquer cidade, e funciona sem rede. O consultório vira uma
      INSTRUÇÃO, não um número — quem sabe o telefone do próprio obstetra é
      ela, e o telefone está na agenda dela.
    -->
    <div class="telefones">
      <a class="samu" href="tel:192">Ligar para o SAMU · 192</a>
    </div>

    <p class="nota">
      Se for com o seu obstetra, ligue direto para ele — o app não precisa estar aberto.
    </p>
    <p class="nota">Assim que houver sinal, feche e abra o app.</p>
  </body>
</html>
