[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config"]

[test]
# O FUSO DO TESTE É O FUSO DO CONSULTÓRIO.
#
# A régua de idade gestacional ancora em MEIA-NOITE LOCAL, e o defeito que ela
# corrige só aparece num fuso a oeste de Greenwich (das 21h à meia-noite, em
# UTC-3, a data local e a UTC discordam). Rodar os testes em UTC — que é o
# padrão do runner do CI — esconderia exatamente o caso que eles existem para
# travar.
preload = ["./src/test-setup.ts"]
